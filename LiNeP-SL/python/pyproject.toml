[build-system]
requires = ["setuptools>=61.0", "cffi>=1.15.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linep-sl"
version = "0.2.0"
description = "LiNeP-SL — Security Layers for LiNeP"
readme = "../README.md"
requires-python = ">=3.9"
dependencies = [
    "cffi>=1.15.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
