[build-system]
requires = ["setuptools>=77", "cffi>=1.15.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linep-sl"
version = "0.1.0"
description = "LiNeP-SL — Security Layers for LiNeP"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = [
    "cffi>=1.15.0",
]

[project.urls]
"Source Code" = "https://github.com/Mentor82/LiNeP"
"Bug Tracker" = "https://github.com/Mentor82/LiNeP/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
